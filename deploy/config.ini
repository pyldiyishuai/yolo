[server]
; 后端服务地址与端口
host = 127.0.0.1
port = 8000

[frontend]
; 前端地址（用于 CORS 配置），本地部署填 * 即可
origin = *

[model]
; YOLOv8 模型路径（相对于 backend/models/）
; 若文件不存在将自动从网络下载 yolov8n.pt
model_file = yolov8n.pt
; 推理置信度阈值 (0~1)
conf_threshold = 0.4
; 推理 IoU 阈值
iou_threshold = 0.5
; 推理设备: cpu / cuda:0
device = cpu

[camera]
; 相机焦距估算（像素），影响距离估算精度
focal_length = 600
; 自动推理帧间隔（毫秒），前端控制
auto_interval_ms = 200

[sms]
; 短信服务商: none / twilio / aliyun
provider = none

; --- Twilio 配置 ---
; account_sid = ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
; auth_token  = xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
; from_number = +1xxxxxxxxxx

; --- 阿里云短信配置 ---
; access_key_id     = xxxxxxxxxxxx
; access_key_secret = xxxxxxxxxxxx
; sign_name         = 视助系统
; template_code     = SMS_xxxxxxxxx

[storage]
; 本地 SQLite 数据库路径（相对于 backend/）
db_path = logs/data.db
; 日志最大行数，超出自动清理
max_log_rows = 5000
